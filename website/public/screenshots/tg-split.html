<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SplitWala - Split Dinner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',FreeMono,monospace,sans-serif;}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#111;padding:20px;}
.phone{width:393px;height:852px;border-radius:40px;overflow:hidden;background:#000;padding:12px;box-shadow:0 0 60px rgba(0,0,0,.8),0 0 0 1px #333;position:relative;}
.screen{width:100%;height:100%;border-radius:30px;overflow:hidden;background:#212D3B;display:flex;flex-direction:column;}
/* Status Bar */
.status-bar{display:flex;justify-content:space-between;padding:12px 24px 8px;color:#fff;font-size:14px;font-weight:600;background:#1C2733;}
.status-bar .time{font-weight:700;}.status-bar .icons{display:flex;gap:6px;align-items:center;font-size:13px;}
/* Chat Header */
.chat-header{display:flex;align-items:center;padding:8px 12px;background:#1C2733;border-bottom:1px solid rgba(255,255,255,.08);gap:10px;}
.chat-header .back{font-size:22px;color:#fff;padding-right:4px;cursor:default;}
.chat-header .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2AABEE,#8774E1);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;}
.chat-header .info{flex:1;min-width:0;}
.chat-header .info .name{font-size:16px;font-weight:600;color:#fff;}
.chat-header .info .status{font-size:12px;color:#8E9AA8;margin-top:1px;}
.chat-header .icons-right{display:flex;gap:16px;font-size:20px;color:#fff;cursor:default;}
/* Messages */
.chat-area{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none;background:#212D3B;}
.chat-area::-webkit-scrollbar{display:none;}
/* Date Separator */
.date-sep{text-align:center;font-size:12px;color:#8E9AA8;margin:8px 0;background:rgba(255,255,255,.04);padding:4px 12px;border-radius:12px;align-self:center;}
/* Message Bubbles */
.msg{max-width:82%;padding:8px 12px;line-height:1.5;font-size:15px;word-wrap:break-word;position:relative;margin:1px 0;}
.msg.user{align-self:flex-end;background:#2AABEE;color:#fff;border-radius:18px 18px 6px 18px;}
.msg.bot{align-self:flex-start;background:#2A3A4E;color:#fff;border-radius:18px 18px 18px 6px;}
.msg .time-stamp{font-size:10px;color:rgba(255,255,255,.5);text-align:right;margin-top:2px;padding-left:20px;}
.msg.user .time-stamp{color:rgba(255,255,255,.6);}
.msg .cmd{font-family:FreeMono,monospace;font-size:14px;}
.msg .emoji{font-size:16px;}
/* Input Bar */
.input-bar{display:flex;align-items:center;padding:8px 12px 12px;background:#1C2733;gap:8px;border-top:1px solid rgba(255,255,255,.06);}
.input-bar .attach{font-size:22px;color:#8E9AA8;cursor:default;padding:4px;}
.input-bar .field{flex:1;background:#2A3A4E;border:none;border-radius:22px;padding:10px 16px;color:#fff;font-size:15px;outline:none;}
.input-bar .field::placeholder{color:#717D8B;}
.input-bar .send{width:36px;height:36px;border-radius:50%;background:#2AABEE;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;cursor:default;flex-shrink:0;}
/* Bot reply styling */
.amnt{font-weight:700;color:#2AABEE;}
.amnt-gold{color:#F5A623;}
.amnt-green{color:#4CAF50;}
.check{font-size:18px;}
.arrow{color:#8E9AA8;}
</style>
</head>
<body>
<div class="phone">
<div class="screen">
  <div class="status-bar">
    <span class="time">8:42 PM</span>
    <span class="icons">
      <span>&#9679;&#9679;&#9679;&#9679;</span>
      <span style="font-size:16px;">WiFi</span>
      <span style="font-size:18px;">&#x1F4F1;</span>
      <span style="font-size:16px;font-weight:700;">&#x1F501;</span>
    </span>
  </div>
  <div class="chat-header">
    <span class="back">&#x2190;</span>
    <div class="avatar">S</div>
    <div class="info">
      <div class="name">SplitWala Bot</div>
      <div class="status">online</div>
    </div>
    <div class="icons-right">
      <span>&#x1F514;</span>
      <span>&#x22EE;</span>
    </div>
  </div>
  <div class="chat-area">
    <div class="date-sep">8 April</div>

    <!-- User sends split command -->
    <div class="msg user">
      <div><span class="cmd">/split dinner 500 between @me @mohit @vipul</span></div>
      <div class="time-stamp">20:42</div>
    </div>

    <!-- Bot processes and replies -->
    <div class="msg bot">
      <div><span class="check">&#x2705;</span> <strong>Split recorded!</strong></div>
      <div style="margin-top:6px;">&#x1F372; <strong>dinner</strong> &#x2014; &#x20B9;500</div>
      <div style="margin-top:4px;color:#8E9AA8;font-size:13px;">Split 3 ways</div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.15);border-radius:10px;">
        <span style="font-size:20px;">&#x1F4B0;</span>
        <span>Each owes <span class="amnt">&#x20B9;167</span></span>
      </div>
      <div style="margin-top:8px;font-size:13px;color:#B0BEC5;">
        <div>&#x2022; @mohit owes &#x20B9;167</div>
        <div>&#x2022; @vipul owes &#x20B9;167</div>
      </div>
      <div class="time-stamp">20:42</div>
    </div>
  </div>
  <div class="input-bar">
    <span class="attach">&#x1F4C4;</span>
    <span class="attach" style="font-size:24px;">&#x1F60A;</span>
    <input class="field" type="text" placeholder="Message" value="" readonly>
    <div class="send">&#x2191;</div>
  </div>
</div>
</div>
</body>
</html>
